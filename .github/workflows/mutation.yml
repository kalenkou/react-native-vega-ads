name: Mutation tests
on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Stryker changes the code of react-native-ads-core one small step at a time (a mutant) and runs
      # the tests that cover it. A mutant the tests do not catch shows a gap in them.
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: packages/core/reports/mutation/
