name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      # Lint, typecheck and all unit tests.
      - run: npm run check
      # Known vulnerabilities in what the published packages install (dev tools are not shipped).
      - run: npm audit --omit=dev
      # What `npm publish` would ship.
      - run: npm pack --dry-run -w packages/core -w packages/vega
